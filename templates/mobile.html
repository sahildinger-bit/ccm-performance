<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CCM Mobile</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,sans-serif;
}

body{
background:#070707;
color:white;
padding:20px;
padding-bottom:120px;
}

.logo{
font-size:34px;
font-weight:800;
margin-bottom:8px;
color:#f0b90b;
}

.subtitle{
color:#999;
margin-bottom:30px;
}

.card{
background:#111;
border:1px solid #222;
border-radius:24px;
padding:22px;
margin-bottom:18px;
}

.card h2{
font-size:24px;
margin-bottom:10px;
}

.card p{
color:#aaa;
margin-bottom:20px;
}

.btn{
display:block;
width:100%;
padding:18px;
border-radius:18px;
background:#f0b90b;
color:black;
text-align:center;
text-decoration:none;
font-weight:700;
font-size:18px;
}

.bottom{
position:fixed;
bottom:0;
left:0;
width:100%;
background:#111;
border-top:1px solid #222;
display:flex;
justify-content:space-around;
padding:16px 0;
}

.bottom a{
color:#f0b90b;
text-decoration:none;
font-size:14px;
font-weight:bold;
}

</style>
</head>

<body>

<div class="logo">CCM Performance</div>
<div class="subtitle">Luxury Rental Cars</div>

<div class="card">
<h2>Buchungen</h2>
<p>Alle Vermietungen verwalten</p>
<a class="btn" href="/m/bookings">Öffnen</a>
</div>

<div class="card">
<h2>Fahrzeuge</h2>
<p>Fuhrpark verwalten</p>
<a class="btn" href="/vehicles">Öffnen</a>
</div>

<div class="card">
<h2>Kunden</h2>
<p>Kundenverwaltung</p>
<a class="btn" href="/customers">Öffnen</a>
</div>

<div class="card">
<h2>Rechnungen</h2>
<p>PDF Rechnungen erstellen</p>
<a class="btn" href="/contracts">Öffnen</a>
</div>

<div class="bottom">
<a href="/app">Home</a>
<a href="/m/bookings">Buchungen</a>
<a href="/vehicles">Autos</a>
<a href="/customers">Kunden</a>
</div>

</body>
</html>
