<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCM Mobile</title>

<style>
body{
    margin:0;
    background:#070707;
    color:white;
    font-family:Arial;
    padding:20px;
}

h1{
    color:#d6b46c;
    font-size:32px;
}

.card{
    background:#111;
    border:1px solid #222;
    border-radius:20px;
    padding:20px;
    margin-bottom:20px;
}

.btn{
    display:block;
    background:#d6b46c;
    color:black;
    text-decoration:none;
    padding:16px;
    border-radius:14px;
    text-align:center;
    font-weight:bold;
    margin-top:15px;
}
</style>
</head>

<body>

<h1>CCM Performance</h1>

<div class="card">
<h2>Buchungen</h2>
<p>Alle Vermietungen verwalten</p>
<a class="btn" href="/bookings">Öffnen</a>
</div>

<div class="card">
<h2>Fahrzeuge</h2>
<p>Fahrzeuge verwalten</p>
<a class="btn" href="/vehicles">Öffnen</a>
</div>

<div class="card">
<h2>Kunden</h2>
<p>Kunden verwalten</p>
<a class="btn" href="/customers">Öffnen</a>
</div>

</body>
</html>
